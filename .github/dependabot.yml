version: 2
  
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: npm
    directory: /fynancials-client-angular
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
    # Security updates bypass the schedule and the cooldown above, and `multi-ecosystem-group` only covers version updates. Without an
    # explicit `applies-to: security-updates` group they arrive as one PR per advisory.
    groups:
      all-security-updates:
        applies-to: security-updates
        patterns: [ "*" ]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: npm
    directory: /fynancials-api
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
    groups:
      all-security-updates:
        applies-to: security-updates
        patterns: [ "*" ]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: maven
    directory: /fynancials-server-spring
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
    groups:
      all-security-updates:
        applies-to: security-updates
        patterns: [ "*" ]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
