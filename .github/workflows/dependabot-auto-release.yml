name: Auto release after Dependabot merge

on:
  pull_request:
    types: [ closed ]

permissions:
  actions: write
  contents: read
  pull-requests: read

# Keyed on the PR author, because concurrency is evaluated before the job's `if`: every closed PR starts a run, and without the key a
# human PR closing would cancel a Dependabot wave's pending release.
concurrency:
  group: dependabot-auto-release-${{ github.event.pull_request.user.login }}
  cancel-in-progress: true

jobs:
  trigger-release:
    # A github-actions update changes nothing that ships to users — it would cut a version whose only content is a CI bump. Only npm and
    # maven updates (the per-ecosystem version and security groups) are worth a release.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main' &&
      !startsWith(github.event.pull_request.head.ref, 'dependabot/github_actions/')
    runs-on: ubuntu-latest
    steps:
      # Dependabot opens a wave's PRs minutes apart, and auto-merge lands each one in about two — so the count below, which cannot see a PR
      # that does not exist yet, would fire a release into the gap. Wait the wave out first: every later merge cancels this run through the
      # concurrency group above, leaving only the last one to reach the count.
      - run: sleep 900

      # A batch of Dependabot PRs merges one after another. Releasing after each of them would cut a version — and run the full three-OS
      # build — per PR, and every release commit pushes the remaining PRs behind main again. Release once, after the last one lands. The
      # count covers what the wait does not: a PR that is already open but still in CI.
      # github-actions PRs are excluded here too: waiting for one would strand the release entirely, since merging it does not release.
      - id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          count=$(gh pr list --repo "$REPO" --state open --base main --app dependabot --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("dependabot/github_actions/") | not)] | length')
          echo "Releasable Dependabot PRs still queued: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - if: steps.pending.outputs.count == '0'
        run: gh workflow run release.yml --repo "${{ github.repository }}" -f bump=patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
