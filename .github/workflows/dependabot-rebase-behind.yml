name: Rebase Dependabot PRs behind main

# The main ruleset requires branches to be up to date before merging, and GitHub does not update Dependabot branches on its own. Whenever
# main moves (a merge, or the release commit produced by dependabot-auto-release.yml), every other open Dependabot PR falls behind and its
# auto-merge can never fire again. Asking Dependabot to rebase keeps that queue moving.

on:
  push:
    branches: [ main ]

concurrency:
  group: dependabot-rebase-behind
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Dependabot to rebase every PR that fell behind
        env:
          # Actions store: this run is triggered by a push, not by Dependabot, so it is not sandboxed. Dependabot only obeys `@dependabot`
          # commands from an account with write access, which is why this cannot use GITHUB_TOKEN. See MAINTAINING.md.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          prs=$(gh pr list --repo "$REPO" --state open --base main --app dependabot --json number --jq '.[].number')
          if [ -z "$prs" ]; then
            echo "No open Dependabot PRs."
            exit 0
          fi
          for pr in $prs; do
            # mergeStateStatus is computed asynchronously; right after a push it is still UNKNOWN for a few seconds.
            for _ in 1 2 3 4 5 6; do
              status=$(gh pr view "$pr" --repo "$REPO" --json mergeStateStatus --jq .mergeStateStatus)
              if [ "$status" != "UNKNOWN" ]; then
                break
              fi
              sleep 5
            done
            echo "PR #$pr: $status"
            if [ "$status" = "BEHIND" ]; then
              gh pr comment "$pr" --repo "$REPO" --body "@dependabot rebase"
            fi
          done
