<div class="performance-label">
    <h4 [class]="performanceRelativeStyle">
        @if (performanceRelative === 'infinity') {
            +&infin;
        } @else {
            {{ performanceIsPositive ? '+' : '' }}{{ performanceRelative | tqPercent }}
        }
    </h4>
    @if (!this.hideAbsoluteValues) {
        <h4 [class]="performanceAbsoluteStyle">
            {{ performanceIsPositive ? '+' : '' }}{{ performanceAbsolute | tqCurrency:currency }}
        </h4>
    }
</div>
