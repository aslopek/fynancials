<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TraQuity</title>
  <base href="/">
    <meta content="width=device-width, initial-scale=1"
          name="viewport">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                   script-src 'self';
                   style-src 'self' 'unsafe-inline';
                   font-src 'self';
                   img-src 'self' data: blob: http://localhost:* http://127.0.0.1:*;
                   connect-src 'self' http://localhost:* http://127.0.0.1:* https://api.github.com;
                   frame-src http://localhost:* http://127.0.0.1:*;
                   object-src 'none';
                   base-uri 'self';
                   form-action 'self';">
  <meta name="referrer" content="no-referrer">
    <link href="favicon.ico"
          rel="icon"
          type="image/x-icon">
    <!-- The three font families are bundled (angular.json's `styles`) rather than fetched from Google's CDN: the app
         is offline-capable by design, `<mat-icon>` renders ligatures and would show the icon's name as text without
         its font, and a request on every start would tell a third party when this app runs. -->
</head>
<body class="mat-typography mat-app-background">
<app-root></app-root>
</body>
</html>
