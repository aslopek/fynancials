<div class="container">
    <app-title-toolbar (onClose)="cancel()"
                       title="Restart & configure database"
                       class="title-bar">
    </app-title-toolbar>

    <div class="wrapper">
        <p>The app restarts and opens the configuration screen.</p>

        <div class="button-group">
            <button (click)="confirm()"
                    mat-flat-button
                    color="primary">
                Restart & configure
            </button>
            <button (click)="cancel()"
                    mat-stroked-button
                    color="primary">
                Cancel
            </button>
        </div>
    </div>
</div>
