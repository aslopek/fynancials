openapi: 3.0.3
info:
  title: Configuration API
  description: The API definitions for reading and manipulating the application's configuration
  version: 1.0.0
servers:
  - url: 'http://localhost:23726'
    description: Locally serving the API

paths:
  /config/clients/{clientId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      parameters:
        - $ref: '#/components/parameters/Prefix'
      tags:
        - Config
      operationId: getClientConfig
      responses:
        '200':
          description: Returns a map of string keys and values, representing the entire configuration for the client
          content:
            application/json:
              schema:
                type: object
                nullable: false
                additionalProperties:
                  type: string
                  nullable: false
                  minLength: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
        - Config
      operationId: deleteClientConfig
      responses:
        '204':
          description: Successfully deleted the entire configuration for the client, or there was nothing to delete
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /config/clients/{clientId}/{clientConfigKey}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientConfigKey'
    get:
      tags:
        - Config
      operationId: getClientConfigValue
      responses:
        '200':
          description: Returns the value of the specified key in the client's configuration
          content:
            text/plain:
              schema:
                type: string
                nullable: false
                example: dark
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The specified key does not exist in the client's configuration
    put:
      tags:
        - Config
      operationId: setClientConfigValue
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              nullable: false
              example: dark
      responses:
        '204':
          description: Successfully updated the value of the specified key in the client's configuration
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
        - Config
      operationId: deleteClientConfigValue
      responses:
        '204':
          description: Successfully deleted the specified key from the client's configuration, or there was nothing to delete
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /config/currencies:
    get:
      tags:
        - Config
      operationId: getSupportedCurrencies
      responses:
        '200':
          description: Returns a list of all supported currencies
          content:
            application/json:
              schema:
                type: array
                nullable: false
                minItems: 1
                items:
                  $ref: '#/components/schemas/Currency'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /config/currencies/default:
    get:
      tags:
        - Config
      operationId: getDefaultCurrency
      responses:
        '200':
          description: Returns the default currency for the application
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Currency'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  parameters:
    ClientId:
      name: clientId
      in: path
      required: true
      description: Identifies a client
      schema:
        type: string
        nullable: false
        minLength: 1
        maxLength: 255
        example: angular-material

    ClientConfigKey:
      name: clientConfigKey
      in: path
      required: true
      description: Identifies a key in the client's configuration
      schema:
        type: string
        nullable: false
        minLength: 1
        maxLength: 255
        example: theme

    Prefix:
      name: prefix
      in: query
      required: false
      description: Filter results based on the client config key prefix
      schema:
        type: string
        nullable: false
        minLength: 1
        maxLength: 255
        example: app-config

  responses:
    Unauthorized:
      description: |
        The request carried no valid credentials, or credentials the server rejected. A deployment that does not authenticate never
        answers this, and a caller must not treat its absence as a promise that the endpoint is open.
    Forbidden:
      description: |
        The caller is authenticated but not permitted to perform this operation - a read-only registration issuing a write, for
        instance. A deployment that does not authorize never answers this.

  schemas:
    Currency:
      type: string
      nullable: false
      pattern: ^[A-Z]{3}$
      example: USD
